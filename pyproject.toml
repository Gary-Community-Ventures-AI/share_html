[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sharehtml"
version = "0.1.0"
description = "Agent-native HTML publishing with isolated document origins"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "flask>=3.1,<4",
  "flask-migrate>=4.1,<5",
  "flask-sqlalchemy>=3.1,<4",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
  "pyjwt[crypto]>=2.10,<3",
  "python-dotenv>=1.1,<2",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
